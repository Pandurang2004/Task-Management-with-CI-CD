name: tms-cicd-pipeline

on: 
  push:
    branches:
      -master

jobs:
    build-test:
        runs-on: ubuntu-latest

        steps:
            -name: Checkout code 
             uses: actions/checkout@v4

            -name: Setup python
             uses: actions/setup-python@v5

            -name: Install dependencies
             run: 
              pip install django
            

            -name: Run Tests
             run:
              python manage.py test
            